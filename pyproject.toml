[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmae"
version = "0.1.0"
description = "PMAE: proportionally masked autoencoders for tabular data imputation (AAAI 2025)"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["imputation", "missing data", "tabular data", "masked autoencoder", "deep learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
  { name = "Jungkyu Kim" },
  { name = "Kibok Lee" },
  { name = "Taeyoung Park" },
]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.1",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",                 # PMAE, ReMasker
  "xlrd>=2.0",                  # the Default dataset (.xls)
  "xgboost>=2.0",               # Utility
  "hyperimpute==0.1.17",        # EM, GAIN, HyperImpute
  "miceforest>=6.0",            # MiceForest
  "lightgbm>=4.0,<4.7",         # MiceForest (miceforest 6.0 needs lightgbm < 4.7)
]

[project.urls]
Homepage = "https://github.com/normal-kim/PMAE"
Paper = "https://ojs.aaai.org/index.php/AAAI/article/view/33967"
arXiv = "https://arxiv.org/abs/2412.19152"

[tool.setuptools.packages.find]
include = ["pmae*"]
